name: Build GTA V News
on:
  schedule:
    - cron: '0 0 1 */2 *'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Find MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $path = (Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Filter "MSBuild.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $path) { $path = (Get-ChildItem -Path "C:\Program Files (x86)" -Filter "MSBuild.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
          Write-Host "MSBuild: $path"
          $path | Out-File -FilePath "$env:GITHUB_WORKSPACE\msbuild_path.txt" -NoNewline
      - name: Build
        shell: cmd
        run: |
          set /p MSBUILD_PATH=<msbuild_path.txt
          "%MSBUILD_PATH%" GTAVNews.csproj /p:Configuration=Release /p:TargetPlatformVersion=10.0.17763.0 /t:Build /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxBundle=Never /p:AppxPackageSigningEnabled=false
      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GTAVNews-MSIX
          path: '**/*.msix'