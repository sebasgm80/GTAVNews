name: Build GTA V News

on:
  schedule:
    - cron: '0 0 1 */2 *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      UWP_BUILD_MODE: SideloadOnly

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify Windows SDK
        shell: pwsh
        run: |
          Write-Host "Checking Windows SDK..."
          $sdks = Get-ChildItem "C:\Program Files (x86)\Windows Kits\Include" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending
          if ($sdks) {
            Write-Host "Available SDKs: $($sdks.Name -join ', ')"
          }
          Write-Host "Visual Studio location: $env:VSINSTALLDIR"
          Write-Host "MSBuild: $(Get-Command MSBuild).Source"

      - name: Build UWP (Sideload)
        shell: pwsh
        run: |
          $csproj = "GTAVNews.csproj"
          Write-Host "Building $csproj..."
          Write-Host "Working directory: $(Get-Location)"
          
          # Use MSBuild from setup-msbuild action
          $msbuild = "MSBuild.exe"
          
          $params = @(
            $csproj,
            "/p:Configuration=Release",
            "/p:Platform=x64",
            "/t:Build",
            "/p:UapAppxPackageBuildMode=Store",
            "/p:AppxBundle=Always",
            "/p:AppxPackageDir="$(Get-Location)\AppxPackages"",
            "/p:AppxPackageSigningEnabled=false",
            "/verbosity:minimal"
          )
          
          Write-Host "Running: $msbuild $($params -join ' ')"
          & $msbuild @params
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Build succeeded"
            # Find the generated files
            Get-ChildItem -Recurse -Path "GTAVNewsin" -Include "*.msix", "*.appx", "*.appxbundle" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Generated: $($_.FullName)"
            }
            Get-ChildItem -Recurse -Path "AppxPackages" -Include "*.msix", "*.appx", "*.appxbundle" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Generated in AppxPackages: $($_.FullName)"
            }
          } else {
            Write-Host "❌ Build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Upload artifact (.msix or .appx)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTAVNews-MSIX
          path: |
            GTAVNews/bin/**/*.msix
            GTAVNews/bin/**/*.appx
            GTAVNews/bin/**/*.appxbundle
            AppxPackages/**/*.msix
            AppxPackages/**/*.appx
            AppxPackages/**/*.appxbundle
          if-no-files-found: ignore

      - name: Report status
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Build completed ==="
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ SUCCESS - App package generated"
          } else {
            Write-Host "❌ FAILED - Check logs above"
          }
