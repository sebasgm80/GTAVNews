name: Build GTA V News

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 1 */2 *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          msbuild GTAVNews.csproj -t:restore

      - name: Create self-signed certificate
        shell: pwsh
        run: |
          # Create a self-signed code signing cert matching the manifest Publisher (CN=sebas)
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=sebas" `
            -KeyUsage DigitalSignature `
            -FriendlyName "GTAVNews Dev Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")

          $thumbprint = $cert.Thumbprint
          Write-Host "Certificate thumbprint: $thumbprint"

          # Export PFX (for signing) and CER (for user to install)
          $pfxPassword = ConvertTo-SecureString -String "$(openssl rand -base64 16)" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "GTAVNews.pfx" -Password $pfxPassword | Out-Null
          Export-Certificate -Cert $cert -FilePath "GTAVNews.cer" | Out-Null

          Write-Host "✅ Certificate created and exported"

          # Save thumbprint for next step
          echo "CERT_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV

      - name: Build UWP (Store, x64, Bundle)
        shell: pwsh
        run: |
          $csproj = "GTAVNews.csproj"
          Write-Host "Building $csproj..."

          $params = @(
            $csproj,
            "/p:Configuration=Release",
            "/p:Platform=x64",
            "/p:AppxBundle=Always",
            "/p:AppxBundlePlatforms=x64",
            "/p:UapAppxPackageBuildMode=Store",
            "/p:AppxPackageSigningEnabled=true",
            "/p:PackageCertificateKeyFile=GTAVNews.pfx",
            "/p:PackageCertificatePassword=$(openssl rand -base64 16)",
            "/p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT",
            "/verbosity:normal"
          )

          Write-Host "Running: MSBuild $($params -join ' ')"
          MSBuild.exe @params

          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Build succeeded"
            Get-ChildItem -Recurse -Path "bin" -Include "*.msix", "*.appx", "*.appxbundle" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Generated: $($_.FullName)"
            }
          } else {
            Write-Host "❌ Build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GTAVNews-MSIX
          path: |
            bin/**/*.msixbundle
            bin/**/*.msix
            bin/**/*.appx
            bin/**/*.appxbundle
            GTAVNews.cer
          if-no-files-found: warn

      - name: Report status
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Build completed ==="
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ SUCCESS - Signed app package generated"
          } else {
            Write-Host "❌ FAILED - Check logs above"
          }
