name: Build GTA V News

on:
  schedule:
    - cron: '0 0 1 */2 *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          msbuild GTAVNews.csproj -t:restore

      - name: Build UWP (Store, x64, Bundle)
        shell: pwsh
        run: |
          $csproj = "GTAVNews.csproj"
          Write-Host "Building $csproj..."

          $sdkDir = "C:\Program Files (x86)\Windows Kits\10\UnionMetadata"
          $installedSdk = "10.0.22621.0"
          if (Test-Path $sdkDir) {
            $found = (Get-ChildItem $sdkDir -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
            if ($found) { $installedSdk = $found }
          }
          Write-Host "Using SDK: $installedSdk"

          $params = @(
            $csproj,
            "/p:Configuration=Release",
            "/p:Platform=x64",
            "/p:TargetPlatformVersion=$installedSdk",
            "/p:TargetPlatformMinVersion=10.0.17763.0",
            "/p:AppxBundle=Always",
            "/p:UapAppxPackageBuildMode=Store",
            "/p:AppxPackageSigningEnabled=false",
            "/verbosity:normal"
          )

          Write-Host "Running: MSBuild $($params -join ' ')"
          MSBuild.exe @params

          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Build succeeded"
            Get-ChildItem -Recurse -Path "bin" -Include "*.msix", "*.appx", "*.appxbundle" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Generated: $($_.FullName)"
            }
          } else {
            Write-Host "❌ Build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTAVNews-MSIX
          path: |
            bin/**/*.msix
            bin/**/*.appx
            bin/**/*.appxbundle
          if-no-files-found: ignore

      - name: Report status
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Build completed ==="
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ SUCCESS - App package generated"
          } else {
            Write-Host "❌ FAILED - Check logs above"
          }
