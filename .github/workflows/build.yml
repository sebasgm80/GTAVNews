name: Build GTA V News
on:
  schedule:
    - cron: '0 0 1 */2 *'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build & Package
        run: |
          msbuild GTAVNews.csproj /p:Configuration=Release /p:Platform=x64 /t:Publish /p:UapAppxPackageBuildMode=SideloadOnly /p:GenerateAppInstallerFile=false /p:AppxBundle=Never
          Get-ChildItem -Recurse -Filter *.msix
      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: GTAVNews-MSIX
          path: GTAVNews/bin/x64/Release/Appx/*.msix