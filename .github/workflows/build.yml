name: Build GTA V News
on:
  schedule:
    - cron: '0 0 1 */2 *'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find MSBuild
        id: msbuild
        run: |
          $path = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Filter msbuild.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $path) { $path = "msbuild" }
          Write-Output "::set-output name=path::$path"
        shell: pwsh
      - name: Build UWP
        run: |
          & "${{ steps.msbuild.outputs.path }}" GTAVNews.csproj /p:Configuration=Release /p:Platform=x64 /t:Publish /p:UapAppxPackageBuildMode=SideloadOnly
      - name: Find MSIX
        run: |
          Get-ChildItem -Recurse -Filter *.msix | ForEach-Object { $_.FullName }
      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: GTAVNews-MSIX
          path: GTAVNews/bin/x64/Release/Appx/*.msix