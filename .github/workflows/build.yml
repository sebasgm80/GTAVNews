name: Build GTA V News

on:
  schedule:
    - cron: '0 0 1 */2 *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Install Windows SDK 10.0.26100 (UAP reference assemblies)
        shell: pwsh
        run: |
          Write-Host "Installing Windows SDK 10.0.26100 via chocolatey..."
          choco install windows-sdk-10-version-2004-all -y --no-progress 2>&1 | Out-Null
          Write-Host "Windows SDK installed"

      - name: Verify SDK installation
        shell: pwsh
        run: |
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\Include"
          Write-Host "SDK Include folder:"
          Get-ChildItem $sdkPath -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.Name)" }
          Write-Host "SDK References folder:"
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\References" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          nuget restore GTAVNews.csproj

      - name: Build UWP (Store, x64, Bundle)
        shell: pwsh
        run: |
          $csproj = "GTAVNews.csproj"
          Write-Host "Building $csproj..."

          $params = @(
            $csproj,
            "/p:Configuration=Release",
            "/p:Platform=x64",
            "/p:AppxBundle=Always",
            "/p:UapAppxPackageBuildMode=Store",
            "/p:AppxPackageSigningEnabled=false",
            "/verbosity:normal"
          )

          Write-Host "Running: MSBuild $($params -join ' ')"
          MSBuild.exe @params

          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Build succeeded"
            Get-ChildItem -Recurse -Path "bin" -Include "*.msix", "*.appx", "*.appxbundle" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Generated: $($_.FullName)"
            }
          } else {
            Write-Host "❌ Build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTAVNews-MSIX
          path: |
            bin/**/*.msix
            bin/**/*.appx
            bin/**/*.appxbundle
          if-no-files-found: ignore

      - name: Report status
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Build completed ==="
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ SUCCESS - App package generated"
          } else {
            Write-Host "❌ FAILED - Check logs above"
          }
