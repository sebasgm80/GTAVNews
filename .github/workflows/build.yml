name: Build GTA V News
on:
  schedule:
    - cron: '0 0 1 */2 *'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Install UWP SDK
        run: |
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $installer modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.Component.Windows10SDK --quiet --norestart --wait
          Write-Host "SDK installation completed"
      - name: Verify SDK
        run: |
          $refs = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\References" -ErrorAction SilentlyContinue
          if ($refs) { Write-Host "SDK found: $($refs.Count) versions" }
          else { Write-Host "No SDK references found" }
      - name: Build & Package
        run: |
          msbuild GTAVNews.csproj /p:Configuration=Release /p:Platform=x64 /t:Publish /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxBundle=Never /p:GenerateAppInstallerFile=false /p:AppInstallerUri="" 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "Build failed with exit code $LASTEXITCODE" }
      - name: Find MSIX
        run: |
          $msix = Get-ChildItem -Recurse -Filter *.msix -ErrorAction SilentlyContinue
          if ($msix) { $msix | ForEach-Object { Write-Host "Found: $($_.FullName)" } }
          else { Write-Host "No MSIX files found" }
      - name: Sign MSIX
        if: always()
        run: |
          $msix = Get-ChildItem -Recurse -Filter *.msix -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msix) {
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=GTAVNewsDev" -CertStoreLocation Cert:\CurrentUser\My
            Set-AuthenticodeSignature -FilePath $msix.FullName -Certificate $cert -HashAlgorithm SHA256
            Write-Host "Signed: $($msix.FullName)"
          }
      - name: Upload MSIX
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: GTAVNews-MSIX
          path: '**/*.msix'